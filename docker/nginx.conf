# ============================================================
# VisionTrack — Nginx reverse proxy
# Handles WebSocket upgrades and MJPEG stream proxying.
# ============================================================

upstream fastapi {
    server fastapi:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 20M;

    # WebSocket support
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # WebSocket endpoint — long timeout for persistent connections
    location /ws/ {
        proxy_pass http://fastapi;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # MJPEG streams — disable buffering
    location /stream/ {
        proxy_pass http://fastapi;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        add_header Cache-Control "no-store, no-cache";
    }

    # Static files — aggressive caching
    location /static/ {
        proxy_pass http://fastapi;
        proxy_cache_valid 200 1d;
        add_header Cache-Control "public, max-age=86400";
    }

    # Everything else
    location / {
        proxy_pass http://fastapi;
        proxy_read_timeout 60s;
    }
}
