# ============================================================
# VisionTrack — Docker Compose (GPU)
# Usage: docker compose up -d
# ============================================================

version: "3.9"

services:

  qdrant:
    image: qdrant/qdrant:v1.9.2
    container_name: visiontrack-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__LOG_LEVEL: WARN
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD-SHELL", "exit 0"]
      interval: 10s
      timeout: 5s
      retries: 1
      start_period: 1s
    networks:
      - visiontrack

  fastapi:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: visiontrack-app
    restart: unless-stopped
    depends_on:
      qdrant:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./config:/app/config:ro
      - ./storage:/app/storage
      - yolo_cache:/root/.config/Ultralytics
    environment:
      APP_QDRANT_HOST: qdrant
      APP_QDRANT_PORT: 6333
      APP_DEBUG: "false"
      CONFIG_DIR: /app/config
      STORAGE_DIR: /app/storage
    # ── Webcam access (uncomment jika pakai webcam USB) ──────
    # devices:
    #   - /dev/video0:/dev/video0
    #   - /dev/video1:/dev/video1
    # group_add:
    #   - video
    gpus: all
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/system"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - visiontrack

  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: visiontrack-mediamtx
    restart: unless-stopped
    ports:
      - "8554:8554" # RTSP
      - "1935:1935" # RTMP (optional)
    volumes:
      - ./docker/mediamtx.yml:/rtsp-simple-server.yml:ro
    networks:
      - visiontrack

  # nginx:
  #   image: nginx:1.25-alpine
  #   container_name: visiontrack-nginx
  #   restart: unless-stopped
  #   depends_on:
  #     - fastapi
  #   ports:
  #     - "80:80"
  #   volumes:
  #     - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
  #   networks:
  #     - visiontrack

volumes:
  qdrant_data:
    name: visiontrack_qdrant_data
  yolo_cache:
    name: visiontrack_yolo_cache

networks:
  visiontrack:
    name: visiontrack_network
    driver: bridge
